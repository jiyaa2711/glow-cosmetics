<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd3e2"/>
      <stop offset="1" stop-color="#f08fb3"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0659b"/>
      <stop offset="1" stop-color="#b52a68"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a3a72"/>
      <stop offset="1" stop-color="#3d1a3a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c08a"/>
      <stop offset="1" stop-color="#b98944"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffe6ef" stop-opacity=".75"/>
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="270" fill="url(#bg)" opacity=".55"/>
  <circle cx="300" cy="300" r="205" fill="#ffffff" opacity=".28"/>

  <!-- leaves -->
  <path d="M70 470 C40 380 90 320 150 300 C160 370 130 440 70 470Z" fill="#7fbf9b" opacity=".85"/>
  <path d="M85 470 C100 400 120 350 150 300" stroke="#4f9a72" stroke-width="3" fill="none"/>
  <path d="M540 470 C575 385 530 320 470 300 C455 370 485 440 540 470Z" fill="#7fbf9b" opacity=".85"/>
  <path d="M525 470 C510 400 490 350 470 300" stroke="#4f9a72" stroke-width="3" fill="none"/>

  <!-- ground shadow -->
  <ellipse cx="300" cy="500" rx="235" ry="20" fill="#3d1a3a" opacity=".18"/>

  <!-- compact -->
  <ellipse cx="170" cy="478" rx="72" ry="22" fill="#3d1a3a" opacity=".12"/>
  <rect x="100" y="418" width="140" height="66" rx="30" fill="url(#gold)"/>
  <ellipse cx="170" cy="418" rx="70" ry="24" fill="#f4dcae"/>
  <ellipse cx="170" cy="416" rx="54" ry="16" fill="#f7b9cf"/>
  <ellipse cx="150" cy="412" rx="16" ry="5" fill="#ffffff" opacity=".55"/>

  <!-- serum dropper bottle -->
  <rect x="190" y="290" width="104" height="200" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-width="3"/>
  <rect x="190" y="370" width="104" height="120" rx="24" fill="url(#rose)" opacity=".92"/>
  <rect x="222" y="252" width="40" height="42" rx="8" fill="url(#plum)"/>
  <ellipse cx="242" cy="238" rx="20" ry="28" fill="url(#plum)"/>
  <rect x="204" y="300" width="10" height="170" rx="5" fill="#ffffff" opacity=".45"/>
  <rect x="216" y="404" width="52" height="42" rx="8" fill="#ffffff" opacity=".92"/>
  <text x="242" y="432" font-family="Georgia, serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#3d1a3a">Glow</text>

  <!-- perfume bottle (center) -->
  <rect x="305" y="205" width="130" height="285" rx="30" fill="url(#plum)"/>
  <rect x="305" y="205" width="130" height="285" rx="30" fill="url(#rose)" opacity=".35"/>
  <rect x="345" y="140" width="50" height="46" rx="8" fill="url(#gold)"/>
  <rect x="338" y="176" width="64" height="34" rx="6" fill="#3d1a3a"/>
  <rect x="325" y="228" width="12" height="230" rx="6" fill="#ffffff" opacity=".28"/>
  <rect x="334" y="316" width="92" height="102" rx="12" fill="#ffffff" opacity=".95"/>
  <text x="380" y="360" font-family="Georgia, serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#3d1a3a">Glow</text>
  <text x="380" y="386" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" text-anchor="middle" fill="#b52a68">EAU DE PARFUM</text>
  <line x1="350" y1="398" x2="410" y2="398" stroke="#c99a5b" stroke-width="2"/>

  <!-- lipstick -->
  <rect x="452" y="392" width="66" height="96" rx="10" fill="url(#gold)"/>
  <rect x="456" y="326" width="58" height="72" rx="8" fill="url(#plum)"/>
  <path d="M462 328 L462 292 Q485 268 508 292 L508 328Z" fill="url(#rose)"/>
  <path d="M470 326 L470 298 Q478 288 486 284" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".55"/>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M110 190 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z"/>
    <path d="M500 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path d="M300 80 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity=".9"/>
    <path d="M540 260 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".8"/>
  </g>
</svg>
